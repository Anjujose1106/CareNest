<!DOCTYPE html>
<html>
<head>
    <title>Carers | CareNest Admin</title>

    <style>

        body{
            margin:0;
            font-family:"Segoe UI",sans-serif;
            background:#f8fafc;
        }

        .layout{
            display:grid;
            grid-template-columns:280px 1fr;
            min-height:100vh;
        }

        .sidebar{
            background:#0f172a;
            color:white;
            padding:30px;
        }

        .sidebar h2{
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:14px;
            margin-bottom:12px;
            border-radius:10px;
        }

        .sidebar a:hover{
            background:#14b8a6;
        }

        .main{
            padding:40px;
        }

        .carers-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:20px;
            box-shadow:0 12px 35px rgba(0,0,0,0.08);
        }

        .card h2{
            margin-bottom:10px;
        }

        .card p{
            color:#64748b;
        }

        .view-btn{
            display:inline-block;
            margin-top:15px;
            background:#14b8a6;
            color:white;
            text-decoration:none;
            padding:10px 20px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="layout">

    <div class="sidebar">

        <h2>CareNest Admin</h2>

        <a href="/admin-dashboard/">Overview</a>

        <a href="/admin-dashboard/applications/">Applications</a>

        <a href="/admin-dashboard/bookings/">Bookings</a>

        <a href="/admin-dashboard/calendar/">Calendar</a>

        <a href="/admin-dashboard/carers/">Carers</a>
        
        <a href="/admin/">Families</a>

        <a href="/admin/">Reviews</a>

        <a href="/logout/">Logout</a>

        <a href="/logout/">Logout</a>

    </div>

    <div class="main">

        <h1>Carers</h1>

        <br>

        <div class="carers-grid">

            {% for carer in carers %}

                <div class="card">

                    <h2>
                        {{ carer.full_name }}
                    </h2>

                    <p>
                        {{ carer.get_care_type_display }}
                    </p>

                    <p>
                        {{ carer.experience_years }}
                        years experience
                    </p>

                    <a href="/admin-dashboard/carers/{{ carer.id }}/" class="view-btn">

                        View Profile

                    </a>

                </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>
</html>
