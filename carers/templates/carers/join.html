{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Become A Carer | CareNest</title>

    <style>

        body{
            margin:0;
            font-family:Segoe UI, sans-serif;
            background:#f8fafc;
        }

        .hero{

            background:linear-gradient(
                rgba(0,0,0,0.6),
                rgba(0,0,0,0.6)
            ),
            url("{% static 'images/hero.jpg' %}");

            background-size:cover;
            background-position:center;

            height:60vh;

            display:flex;
            justify-content:center;
            align-items:center;

            text-align:center;

            color:white;
        }

        .hero h1{
            font-size:60px;
        }

        .container{
            max-width:1000px;
            margin:auto;
            padding:80px 20px;
        }

        .benefits{

            display:grid;
            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:20px;
            margin-top:40px;
        }

        .card{

            background:white;

            padding:30px;

            border-radius:15px;

            box-shadow:
            0 5px 15px rgba(0,0,0,0.08);
        }

        .apply-btn{

            display:inline-block;

            margin-top:40px;

            padding:15px 40px;

            background:#ff4d6d;

            color:white;

            text-decoration:none;

            border-radius:8px;
        }
